<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#a30f2d">
<title>Real or Fake | Fake Image Predictor</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#a30f2d;--ink:#fff5f2;--soft:rgba(255,245,242,.78);--card:rgba(0,0,0,.4);--line:rgba(255,255,255,.28);--btn:#fff5f2;--btnink:#7d0a20;--real:#0e7a5a;--fake:#1a0509}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:540px;margin:0 auto;padding:44px 20px 72px}
h1{font-size:3rem;line-height:1;margin:0 0 10px;letter-spacing:-.04em;font-weight:700}
.tag{margin:0 0 28px;color:var(--soft);font-size:1.05rem}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:250px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);border:2px dashed rgba(255,255,255,.5);border-radius:18px;text-align:center;cursor:pointer;overflow:hidden;padding:14px;transition:background .2s,border-color .2s}
.drop:hover,.drop.on{background:rgba(255,255,255,.14);border-color:#fff}
.drop img{max-width:100%;max-height:360px;border-radius:10px;display:block}
.drop small{color:var(--soft)}
.drop[hidden],.drop *[hidden]{display:none}
button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--btn);color:var(--btnink);font:700 1.05rem inherit;cursor:pointer;transition:transform .1s,opacity .2s}
button:hover:not(:disabled){transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,.drop:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:3px}
#out{margin-top:20px}
.verdict{border-radius:18px;padding:20px 22px;color:#fff;border:1px solid var(--line)}
.verdict.real{background:var(--real)}.verdict.fake{background:var(--fake)}
.verdict b{display:block;font-size:2.6rem;line-height:1.1;letter-spacing:-.03em}
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:14px 22px;margin-top:12px}
.card h2{font-size:1rem;margin:0 0 6px}
.card ul{margin:0;padding-left:20px}.card li{margin:6px 0}
.card summary{cursor:pointer;font-weight:600}
.card div{font-size:.92rem;color:var(--soft);margin-top:4px}
.msg{color:var(--soft)}
.spin{display:flex;align-items:center;gap:12px;color:var(--soft)}
.spin i{width:22px;height:22px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin i{animation-duration:2.4s}button,.drop{transition:none}}

h1,.tag{text-shadow:0 2px 14px rgba(0,0,0,.45)}

</head>
<body>
<main>
  <h1>Real or Fake</h1>
  <p class="tag">Predicting fake images. Upload a photo and find out.</p>

  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload an image">
    <span id="hint">Click or drop an image here to upload</span>
    <img id="pv" alt="Uploaded image" hidden>
    <small id="again" hidden>Click to choose a different image</small>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
  <button id="go" disabled>Check image</button>
  <div id="out" aria-live="polite"></div>
</main>

<script>
const $ = id => document.getElementById(id);
let imgFile = null, busy = false;
const drop = $("drop"), fileIn = $("file");

drop.onclick = () => { if (!busy) fileIn.click(); };
drop.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && !busy) { e.preventDefault(); fileIn.click(); } };
drop.ondragover = e => { e.preventDefault(); drop.classList.add("on"); };
drop.ondragleave = () => drop.classList.remove("on");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("on"); if (!busy) setFile(e.dataTransfer.files[0]); };
fileIn.onchange = e => { setFile(e.target.files[0]); e.target.value = ""; };

function setFile(f) {
  if (!f || !f.type.startsWith("image/")) return;
  imgFile = f;
  const rd = new FileReader(); rd.onload = () => { $("pv").src = rd.result; }; rd.readAsDataURL(f);
  $("pv").hidden = false; $("hint").hidden = true; $("again").hidden = false;
  $("go").disabled = false;
  $("out").innerHTML = "";
}

const pct = x => Math.round(x * 100) + "%";

$("go").onclick = async () => {
  if (!imgFile || busy) return;
  if (location.protocol === "file:") {
    $("out").innerHTML = '<p class="msg">Open this page through the backend: run <code>uvicorn server:app --port 8000</code> and visit <code>http://localhost:8000</code>.</p>';
    return;
  }
  busy = true;
  const btn = $("go"), out = $("out");
  btn.disabled = true; btn.textContent = "Checking...";
  out.innerHTML = '<div class="spin"><i></i><span>Analysing your image...</span></div>';
  const finish = () => { busy = false; btn.disabled = false; btn.textContent = "Check image"; };

  let r;
  try {
    const fd = new FormData(); fd.append("file", imgFile);
    const res = await fetch("/predict", { method: "POST", body: fd });
    if (!res.ok) throw new Error("Server error " + res.status);
    r = await res.json();
  } catch (e) {
    out.innerHTML = '<p class="msg">Could not reach the backend. Make sure <code>uvicorn server:app --port 8000</code> is running.<br>' + e.message + "</p>";
    return finish();
  }

  if (r.label === "REAL") {
    out.innerHTML = '<div class="verdict real"><b>Real</b>No signs of AI generation or manipulation were found.</div>';
  } else {
    const why = [];
    if (r.meta_hit) why.push("The file's hidden metadata " + r.meta_hit + ".");
    if (r.dl_score >= 0.5) why.push("Our trained deepfake model (EfficientNet-B0 + Bi-LSTM) classified the face as fake (" + pct(r.dl_score) + " likelihood).");
    if (r.se_ai !== null && r.se_ai >= 0.5) why.push("Pixel-pattern analysis matched the texture and noise typical of AI image generators (" + pct(r.se_ai) + " likelihood).");
    if (r.se_face !== null && r.se_face >= 0.5) why.push("The face shows signs of being swapped, edited or synthesised (" + pct(r.se_face) + " likelihood).");
    if (r.hf !== null && r.hf >= 0.5) why.push("A Hugging Face detection model classified the image as AI-generated or manipulated (" + pct(r.hf) + " likelihood).");
    if (r.no_camera) why.push("No camera information (make, model, lens) is stored in the file, which is common for generated images.");
    if (!why.length) why.push("The combined score of our model and the API detector was above the fake threshold (" + pct(r.final_score) + ").");
    out.innerHTML = '<div class="verdict fake"><b>Fake</b>This image is likely AI-generated or edited.</div>' +
      '<div class="card"><h2>Why it is fake</h2><ul>' + why.map(w => "<li>" + w + "</li>").join("") + "</ul></div>";
  }

  const rows = ["<div>Our model (EfficientNet-B0 + Bi-LSTM): " + pct(r.dl_score) + "</div>"];
  if (r.se_ai !== null) rows.push("<div>Sightengine AI-generated: " + pct(r.se_ai) + "</div>");
  if (r.se_face !== null) rows.push("<div>Sightengine face manipulation: " + pct(r.se_face) + "</div>");
  if (r.hf !== null) rows.push("<div>Hugging Face model: " + pct(r.hf) + "</div>");
  rows.push("<div>Metadata: " + (r.meta_hit ? r.meta_hit : "no AI label found") + "</div>");
  rows.push("<div>Combined score: " + pct(r.final_score) + " (our model " + pct(r.weights.dl) + " + API " + pct(r.weights.api) + ")</div>");
  out.insertAdjacentHTML("beforeend", '<details class="card"><summary>Detector scores</summary>' + rows.join("") + "</details>");
  if (r.api_score === null) out.insertAdjacentHTML("beforeend", '<p class="msg">' + (r.api_error ? r.api_error + ". " : "No API key set. ") + "This result uses only our model.</p>");
  finish();
};
</script>
</body>
</html>
